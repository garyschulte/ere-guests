name: Integration test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tag of the zesu-zkvm release to download pre-built ELFs from.
  # Update this when pulling in a new zesu-zkvm version.
  ZESU_ZKVM_TAG: "latest"

jobs:
  test:
    name: Test execution of ${{ matrix.guest }} on ${{ matrix.zkvm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        guest:
          - stateless-validator-ethrex
          - stateless-validator-reth
        zkvm:
          - airbender
          - openvm
          - risc0
          - sp1
          - zisk
        exclude:
          - guest: stateless-validator-ethrex
            zkvm: airbender
          - guest: stateless-validator-ethrex
            zkvm: openvm
        include:
          - zkvm: airbender
            threads: 12
          - zkvm: openvm
            threads: 1
          - zkvm: risc0
            threads: 12
          - zkvm: sp1
            threads: 2
          - zkvm: zisk
            threads: 1
          - guest: stateless-validator-ethrex
            zkvm: zisk
            ere_profile: ethrex
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        if: matrix.zkvm == 'zisk'
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache bin target
        uses: actions/cache@v4
        with:
          path: bin/${{ matrix.guest }}/${{ matrix.zkvm }}/target
          key: ${{ runner.os }}-bin-${{ matrix.guest }}-${{ matrix.zkvm }}-${{ hashFiles('bin/${{ matrix.guest }}/${{ matrix.zkvm }}/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bin-${{ matrix.guest }}-${{ matrix.zkvm }}-

      - name: Enable Ere profile
        if: matrix.ere_profile != ''
        env:
          ERE_PROFILE: ${{ matrix.ere_profile }}
        run: echo "ERE_PROFILE=$ERE_PROFILE" >> "$GITHUB_ENV"

      - name: Test
        env:
          RUST_LOG: info
          RAYON_NUM_THREADS: ${{ matrix.threads }}
          ERE_IMAGE_REGISTRY: ghcr.io/eth-act/ere
          OPENVM_RUST_TOOLCHAIN: nightly-2025-10-30
        run: |
          cargo test --release --package ${{ matrix.guest }} --test ${{ matrix.guest }} -- ${{ matrix.zkvm }}

          sudo chown -R $(id -u):$(id -g) bin/${{ matrix.guest }}/${{ matrix.zkvm }}/target || true

      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats

  test-zesu:
    # Tests stateless-validator-zesu against pre-built ELFs downloaded from zesu-zkvm releases.
    name: Test execution of stateless-validator-zesu on ${{ matrix.zkvm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zkvm:
          - zisk
        include:
          - zkvm: zisk
            threads: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        if: ${{ !env.ACT }}
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        if: ${{ !env.ACT }}
        uses: mozilla/sccache-action@v0.0.9

      - name: Configure sccache
        if: ${{ !env.ACT }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Cache cargo registry
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Download Zesu ELF from zesu-zkvm release
        # Skipped when ZESU_ELF_ZISK is already set (e.g. via `act --env ZESU_ELF_ZISK=...`
        # for local testing against a locally built artifact).
        if: env.ZESU_ELF_ZISK == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.ZESU_ZKVM_TAG }}" \
            --repo "${{ github.repository_owner }}/zesu-zkvm" \
            --pattern "stateless-validator-zesu-${{ matrix.zkvm }}.elf" \
            --dir zesu-elfs
          echo "ZESU_ELF_ZISK=$(pwd)/zesu-elfs/stateless-validator-zesu-zisk.elf" >> $GITHUB_ENV

      - name: Test
        env:
          RUST_LOG: info
          RAYON_NUM_THREADS: ${{ matrix.threads }}
          ERE_IMAGE_REGISTRY: ghcr.io/eth-act/ere
        run: |
          cargo test --release --package stateless-validator-test --test stateless-validator-zesu -- ${{ matrix.zkvm }}

      - name: Run sccache stat for check
        if: ${{ !env.ACT }}
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
